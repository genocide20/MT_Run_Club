<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT Running Club | บันทึกระยะทาง</title><link rel="stylesheet" href="style.css"></head>
<body><main class="layout"><section class="intro"><div class="brand"><span class="mark">MT</span> RUNNING CLUB</div><p class="eyebrow">LET’S RUN TOGETHER</p><h1>ทุกก้าว<br><span>เริ่มต้นที่นี่</span></h1><p class="lead">บันทึกระยะเดิน–วิ่ง แล้วสะสมทุกกิโลเมตรไปด้วยกัน</p><div class="track"><span>01 / FIND</span><span>02 / SELECT</span><span>03 / RUN</span></div></section><section class="panel"><p class="eyebrow">FIND YOUR NAME</p><h2>บันทึกระยะเดิน–วิ่ง</h2><p class="hint">ค้นหาและเลือกชื่อของคุณ แล้วกรอกระยะทางที่ทำได้</p><label for="search">ชื่อ–นามสกุล</label><input id="search" type="search" autocomplete="off" placeholder="พิมพ์ชื่อหรือนามสกุล" maxlength="150"><p id="status" role="status" aria-live="polite"></p><div id="results" class="results" aria-label="รายชื่อที่ค้นพบ"></div><div id="selected" class="selected" hidden><span>รายชื่อที่เลือก</span><strong id="selected-name"></strong><p id="selected-organization"></p><p id="total"></p></div><form id="distance-form" hidden><label for="distance">ระยะทางที่ทำได้ (กิโลเมตร)</label><input id="distance" name="distance" type="number" min="0.01" step="0.01" max="1000" inputmode="decimal" placeholder="เช่น 5.25" required><button type="submit">บันทึกระยะทาง <span>↗</span></button><p id="save-status" role="status" aria-live="polite"></p></form><p class="footer">MT RUNNING CLUB <span>MOVE WITH US.</span></p></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
